[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lexmoryn"
version = "0.1.0"
description = "Experimental local, evidence-linked workspace retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["pathspec>=0.12.1,<2"]

[project.optional-dependencies]
semantic = [
    "numpy>=2.1,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=0.28,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
lexmoryn = "lexmoryn.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
